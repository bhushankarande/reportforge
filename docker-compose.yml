services:
  api:
    build:
      context: .
    platform: linux/arm64
    env_file:
      - .env
    environment:
      ACTIVE_LLM_PROVIDER: ${ACTIVE_LLM_PROVIDER:-nvidia}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL_NAME: ${NVIDIA_MODEL_NAME:-deepseek-ai/deepseek-v4-flash}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL_NAME: ${GROQ_MODEL_NAME:-qwen/qwen3-32b}
      NVIDIA_REQUESTS_PER_MINUTE_LIMIT: ${NVIDIA_REQUESTS_PER_MINUTE_LIMIT:-40}
      NVIDIA_DAILY_REQUEST_LIMIT: ${NVIDIA_DAILY_REQUEST_LIMIT:-0}
      GROQ_REQUESTS_PER_MINUTE_LIMIT: ${GROQ_REQUESTS_PER_MINUTE_LIMIT:-60}
      GROQ_DAILY_REQUEST_LIMIT: ${GROQ_DAILY_REQUEST_LIMIT:-1000}
      GROQ_DAILY_TOKEN_LIMIT: ${GROQ_DAILY_TOKEN_LIMIT:-500000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL_NAME: ${OLLAMA_MODEL_NAME:-llama3.1:8b}
    volumes:
      - ./storage:/app/storage
    ports:
      - "8000:8000"
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3

  streamlit:
    build:
      context: .
    platform: linux/arm64
    env_file:
      - .env
    environment:
      ACTIVE_LLM_PROVIDER: ${ACTIVE_LLM_PROVIDER:-nvidia}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL_NAME: ${NVIDIA_MODEL_NAME:-deepseek-ai/deepseek-v4-flash}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL_NAME: ${GROQ_MODEL_NAME:-qwen/qwen3-32b}
      NVIDIA_REQUESTS_PER_MINUTE_LIMIT: ${NVIDIA_REQUESTS_PER_MINUTE_LIMIT:-40}
      NVIDIA_DAILY_REQUEST_LIMIT: ${NVIDIA_DAILY_REQUEST_LIMIT:-0}
      GROQ_REQUESTS_PER_MINUTE_LIMIT: ${GROQ_REQUESTS_PER_MINUTE_LIMIT:-60}
      GROQ_DAILY_REQUEST_LIMIT: ${GROQ_DAILY_REQUEST_LIMIT:-1000}
      GROQ_DAILY_TOKEN_LIMIT: ${GROQ_DAILY_TOKEN_LIMIT:-500000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL_NAME: ${OLLAMA_MODEL_NAME:-llama3.1:8b}
    volumes:
      - ./storage:/app/storage
    ports:
      - "8501:8501"
    command: ["uv", "run", "streamlit", "run", "frontend/streamlit_app.py", "--server.address", "0.0.0.0"]
    depends_on:
      api:
        condition: service_healthy

  # Uncomment the profile below for local Ollama testing:
  ollama:
    image: ollama/ollama:latest
    platform: linux/arm64
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
