[project]
name = "reportforge"
version = "0.1.0"
description = "A Python toolkit for building report generation workflows."
readme = "README.md"
authors = [
    { name = "bhushankarande", email = "bkarande@stevens.edu" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
reportforge = "reportforge:main"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
