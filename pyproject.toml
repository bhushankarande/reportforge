[project]
name = "reportforge"
version = "0.1.0"
description = "A Python toolkit for building report generation workflows."
readme = "README.md"
authors = [
    { name = "bhushankarande", email = "bkarande@stevens.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "diskcache>=5.6.3",
    "fastapi>=0.136.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pydantic-settings>=2.14.1",
    "pypdf>=6.11.0",
    "python-docx>=1.2.0",
    "requests>=2.34.0",
    "sqlalchemy>=2.0.49",
    "streamlit>=1.57.0",
    "structlog>=25.5.0",
    "tabulate>=0.10.0",
    "tenacity>=9.1.4",
    "uvicorn>=0.46.0",
]

[project.scripts]
reportforge = "reportforge:main"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "faker>=40.15.0",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py311"
